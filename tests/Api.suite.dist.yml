actor: ApiTester
modules:
    enabled:
        - REST:
            url: 'https://%HTTP_HOST%'
            depends: PhpBrowser
        - PhpBrowser:
            url: 'https://%HTTP_HOST%'
        - Db:
            dsn: 'mysql:host=127.0.0.1;dbname=%DB_NAME%'
            user: '%DB_UNAME%'
            password: '%DB_UPASS%'
            populate: false
            cleanup: false

step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry

bootstrap: ../codeception/acceptance.bootstrap.php
